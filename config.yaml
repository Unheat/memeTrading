# ==============================================================================
# MEME MARKET FORENSIC RESEARCH AGENT — LOCAL CONFIGURATION
# ==============================================================================
# Adjust your preferences below:
# ==============================================================================

llm:
  # Model name for the outer research agent (e.g. gpt-5.3-codex, gpt-4o, etc.)
  model: "gpt-5.3-codex"

  # Optional OpenAI-compatible base URL.
  # Leave as null for official OpenAI, or set for OpenRouter, DeepSeek, etc.
  base_url: null

  # Sampling temperature:
  #   - 0.0: Purely robotic/deterministic. Rigid hypotheses, flat jokes.
  #   - 0.2 - 0.3 (Recommended): Strategic creativity (uncovering 2nd-order supply chain
  #         beneficiaries, witty Peter & Stewie banter) while keeping numbers strictly grounded.
  #   - 0.7+: Too high for finance (risks hallucinating numbers or breaking JSON schemas).
  temperature: 0.2

media:
  # Whether to generate cited article.md and faceless reel dialogue.json
  generate_media: true

  # Character duo for video reel script: "peter_stewie" or "rick_morty"
  character_pair: "peter_stewie"

research:
  max_tool_calls: 15
  max_identical_calls: 2
  benchmark_ticker: "SPY"
  sec_periods: 4
  cases_root: "cases"
