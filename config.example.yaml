# ==============================================================================
# MEME MARKET FORENSIC RESEARCH AGENT — USER CONFIGURATION TEMPLATE
# ==============================================================================
# Copy this file to config.yaml and adjust your preferences:
#   cp config.example.yaml config.yaml
#
# NOTE: Secret API keys belong in your .env file, NOT here.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. LLM PROVIDER SETTINGS (OPENAI-COMPATIBLE)
# ------------------------------------------------------------------------------
llm:
  # Model identifier for the outer research agent.
  # Examples:
  #   - OpenAI: "gpt-5.3-codex", "gpt-4o", "gpt-4o-mini"
  #   - OpenRouter: "anthropic/claude-3.5-sonnet", "deepseek/deepseek-chat", "meta-llama/llama-3.3-70b-instruct"
  model: "gpt-5.3-codex"

  # Base URL for the OpenAI-compatible endpoint.
  # OPTIONAL:
  #   - Leave as null (or comment it out) to call official OpenAI directly.
  #   - Set to an OpenAI-compatible URL if using OpenRouter, DeepSeek, Together, vLLM, etc.
  # Examples:
  #   base_url: null                            # Uses official OpenAI (https://api.openai.com/v1)
  #   base_url: "https://openrouter.ai/api/v1"  # Uses OpenRouter
  #   base_url: "https://api.deepseek.com/v1"   # Uses DeepSeek
  base_url: null

  # Sampling temperature:
  #   - 0.0: Purely robotic/deterministic. Rigid hypotheses, flat jokes.
  #   - 0.2 - 0.3 (Recommended): Strategic creativity (uncovering 2nd-order supply chain
  #         beneficiaries, witty Peter & Stewie banter) while keeping numbers strictly grounded.
  #   - 0.7+: Too high for finance (risks hallucinating numbers or breaking JSON schemas).
  temperature: 0.2

# ------------------------------------------------------------------------------
# 2. MEDIA & VIDEO REEL SCRIPT GENERATION
# ------------------------------------------------------------------------------
media:
  # Whether to generate the cited Substack-style article (article.md)
  # and the viral video dialogue script (faceless/dialogue.json).
  generate_media: true

  # Character duo for the viral video dialogue reel script.
  # RESTRICTED INPUT — MUST BE EXACTLY ONE OF THE FOLLOWING TWO CHOICES:
  #   - "peter_stewie": Family Guy's Peter Griffin (Speaker A: clueless/gullible retail investor)
  #                     and Stewie Griffin (Speaker B: smug British genius dropping SEC receipts).
  #   - "rick_morty":   Rick and Morty (Speaker A: panicked/nervous Morty questioning trades,
  #                     Speaker B: cynical rogue genius Rick exposing Wall Street consensus).
  character_pair: "peter_stewie"

  # Sampling temperature specifically for comedic video reel dialogue generation.
  # Higher (0.4) allows creative comedic timing, punchy jokes, and witty banter,
  # while the core investigation and accounting checks stay at temperature 0.2.
  reel_temperature: 0.4

  # Fish Audio TTS model for voice synthesis.
  # Options:
  #   - "s2": Flagship Fish Audio model (highest audio quality & emotion inflection)
  #   - "s2-free": Free tier Fish Audio model
  fish_model: "s2"

# ------------------------------------------------------------------------------
# 3. RESEARCH PARAMETERS & EXECUTION LIMITS
# ------------------------------------------------------------------------------
# Note: You can leave all of these as default! They are safe out-of-the-box defaults.
research:
  # The Research Budget: How many actions the agent can take (searching social,
  # checking news, pulling SEC filings, getting market data) before it is forced
  # to stop researching and write your final memo.
  #   - Default: 15 (solid depth, ~1-2 minutes per run)
  #   - Quick summary: 8
  #   - Deep dive audit: 20
  max_tool_calls: 15

  # Anti-Stuck Guard: If the AI asks the exact same tool query twice (e.g. searching
  # Reddit for the exact same phrase again), the 3rd attempt is suppressed and the
  # agent is told to use its existing notes. Prevents wasted tokens in loops.
  #   - Default: 2 (leave as is)
  max_identical_calls: 2

  # Market Comparison Benchmark: The ETF symbol used to compare stock returns against.
  # If a stock is up +10% this month but the broad market is up +15%, the stock is
  # actually underperforming.
  #   - Default: "SPY" (S&P 500 ETF, broad market benchmark)
  #   - Tech comparison: "QQQ" (Nasdaq 100)
  benchmark_ticker: "SPY"

  # SEC Financials History: How many quarters (3-month periods) of official SEC XBRL
  # balance sheets and income statements to extract.
  #   - Default: 4 (1 full year of quarterly trajectory to check margin expansion & inventory)
  #   - 2-year history: 8
  sec_periods: 4

  # Output Directory: The local folder where the agent saves your research artifacts.
  # For ticker "MU", it creates cases/MU-2026-09-14-001/ with:
  #   - memo.md (the forensic research memo)
  #   - article.md (the cited Substack article)
  #   - faceless/dialogue.json (the Peter & Stewie reel script)
  #   - faceless/caption.txt (the viral social media caption with hashtags)
  cases_root: "cases"
